<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Designs Master Gallery</title>
    <style>
        /* बेसिक स्टाइलिंग - आप इसे अपनी पसंद के अनुसार बदल सकते हैं */
        body { font-family: Arial, sans-serif; background-color: #0d1117; color: white; margin: 0; padding: 20px; text-align: center; }
        h1 { margin-bottom: 20px; }
        .search-container { margin-bottom: 30px; }
        .search-bar { padding: 12px; width: 80%; max-width: 400px; border-radius: 25px; border: none; font-size: 16px; outline: none; }
        
        /* गैलरी ग्रिड */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 10px; max-width: 1200px; margin: 0 auto; }
        .card { background: #161b22; border-radius: 12px; padding: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: scale(1.03); }
        .card img { width: 100%; height: auto; border-radius: 8px; object-fit: cover; }
        .card-info { margin-top: 10px; font-size: 14px; color: #8b949e; }
        
        /* Pagination (Next/Prev बटन) स्टाइल */
        .pagination-container { margin: 40px 0; display: flex; justify-content: center; gap: 15px; align-items: center; }
        .btn-page { background-color: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-page:hover:not(:disabled) { background-color: #30363d; color: white; }
        .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }
        #pageInfo { font-size: 16px; color: #c9d1d9; font-weight: bold; }

        /* Modal / Lightbox स्टाइल */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: #161b22; padding: 20px; border-radius: 12px; max-width: 90%; max-height: 90%; text-align: center; }
        .modal-content img { max-width: 100%; max-height: 70vh; border-radius: 8px; }
        .btn-container { margin-top: 15px; display: flex; gap: 10px; justify-content: center; }
        .btn-download, .btn-close { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; }
        .btn-download { background-color: #238636; color: white; }
        .btn-close { background-color: #da3633; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>AI Designs Master Gallery</h1>
        <div class="search-container">
            <input type="text" id="searchBar" class="search-bar" placeholder="Search wallpaper number..." oninput="filterImages()">
        </div>
    </header>

    <!-- इमेजेस यहाँ लोड होंगी -->
    <main class="gallery-grid" id="galleryGrid"></main>

    <!-- 🌟 नया फीचर: Pagination बटन्स -->
    <div class="pagination-container">
        <button id="prevBtn" class="btn-page" onclick="changePage(-1)">⏮️ Previous</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextBtn" class="btn-page" onclick="changePage(1)">Next ⏭️</button>
    </div>

    <!-- Modal Box -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <img src="" id="modalImg" alt="Preview">
            <div class="btn-container">
                <!-- डायरेक्ट डाउनलोड करने के लिए download एट्रिब्यूट जोड़ा गया है -->
                <a href="#" id="downloadBtn" class="btn-download" download>Download HD</a>
                <button class="btn-close" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

<script>
    // 🔗 यहाँ अपना इमेज बेस URL डालें (IMAGE BASE URL)
    const IMAGE_BASE_URL = "https://raw.githubusercontent.com/aidesignsmaster/aidesignsmaster/refs/heads/main/";

    // 📋 आपके स्क्रीनशॉट के अनुसार सभी 311+ इमेजेस की लिस्ट (4230 से लेकर 8884 तक)
    const imagelist = [
        "4230", "4231", "4232", "4233", "4234", "4238", "4239", "4240", "4241", "4242", "4243", "4249", "4257", "4290", "4493", "4520", "4592", "4597", "4601", "4604", "4619", "4620", "4637", "4641", "4723", "4729", "4732", "4734", "4736", "4738", "4741", "4892", "4893", "4894", "4896", "4908", "5008", "5009", "5010", "5012", "5013", "5014", "5118", "5119", "5120", "5121", "5122", "5124", "5125", "5126", "5157", "5158", "5159", "5160", "5161", "5162", "5163", "5164", "5165", "5166", "5579", "5580", "5657", "5658", "5659", "5815", "6556", "6558", "6561", "6562", "6589", "6595", "6596", "6640", "6641", "6642", "6644", "6645", "6646", "6682", "6683", "6684", "6685", "6688", "6689", "6691", "6693", "6694", "6695", "6696", "6700", "6701", "6702", "6703", "6704", "6705", "6706", "6707", "6708", "6719", "6720", "6721", "6722", "6725", "6726", "6727", "6728", "6729", "6753", "6754", "6755", "6756", "6757", "6769", "6770", "6771", "6772", "6779", "6780", "6781", "6782", "6783", "6786", "6789", "6799", "6800", "6801", "6802", "6808", "6809", "6810", "6811", "6812", "6813", "6814", "6815", "6816", "6827", "6828", "6829", "6830", "6831", "6832", "7372", "7373", "7394", "7395", "7396", "7399", "7401", "7402", "7403", "7404", "7407", "7408", "7409", "7416", "7417", "7434", "7436", "7439", "7440", "7443", "7444", "7445", "7449", "7450", "7451", "7452", "7453", "7476", "7478", "7479", "7480", "7481", "7513", "7516", "7520", "7522", "7523", "7541", "7544", "7597", "7598", "7599", "7600", "7602", "7603", "7604", "7605", "7606", "7656", "7657", "7658", "7727", "7728", "7729", "7730", "7731", "8010", "8011", "8012", "8013", "8014", "8068", "8069", "8070", "8071", "8072", "8118", "8136", "8157", "8158", "8159", "8155", "8158", "8159", "8160", "8161", "8162", "8256", "8257", "8258", "8259", "8260", "8263", "8264", "8265", "8266", "8267", "8268", "8269", "8270", "8271", "8373", "8429", "8536", "8563", "8564", "8565", "8566", "8567", "8568", "8569", "8624", "8625", "8626", "8627", "8628", "8873", "8874", "8875", "8876", "8877", "8880", "8881", "8882", "8883", "8884"
    ];

    let currentFilteredList = [...imagelist]; // सर्च फिल्टर के लिए बैकअप लिस्ट
    let currentPage = 1;
    const itemsPerPage = 12; // ⚡ एक बार में केवल 12 इमेजेस लोड होंगी (बिल्कुल स्मूथ चलेगा)

    const galleryGrid = document.getElementById('galleryGrid');
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const downloadBtn = document.getElementById('downloadBtn');

    // गैलरी लोड करने का मुख्य फंक्शन (Pagination के साथ)
    function loadGallery() {
        galleryGrid.innerHTML = "";
        
        if (currentFilteredList.length === 0) {
            galleryGrid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#8b949e;">No Wallpapers Found</p>`;
            updatePaginationControls(0);
            return;
        }

        // हिसाब लगाना कि किस पेज पर कौन सी इमेज दिखेगी
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, currentFilteredList.length);
        const itemsToDisplay = currentFilteredList.slice(startIndex, endIndex);

        itemsToDisplay.forEach(num => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(num);
            card.innerHTML = `
                <img src="${IMAGE_BASE_URL}${num}.webp" alt="Wallpaper ${num}" loading="lazy">
                <div class="card-info">
                    <p class="card-title">Wallpaper ${num}</p>
                </div>
            `;
            galleryGrid.appendChild(card);
        });

        updatePaginationControls(currentFilteredList.length);
    }

    // पेज बदलने और बटन्स को मैनेज करने का फंक्शन
    function updatePaginationControls(totalItems) {
        const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
        document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${totalPages}`;
        
        document.getElementById('prevBtn').disabled = (currentPage === 1);
        document.getElementById('nextBtn').disabled = (currentPage === totalPages);
    }

    function changePage(direction) {
        currentPage += direction;
        loadGallery();
        window.scrollTo({ top: 0, behavior: 'smooth' }); // पेज बदलते ही ऊपर स्क्रॉल हो जाएगा
    }

    // लाइव सर्च फ़िल्टर
    function filterImages() {
        const query = document.getElementById('searchBar').value.trim();
        currentFilteredList = imagelist.filter(num => num.includes(query));
        currentPage = 1; // सर्च करने पर वापस पहले पेज से शुरुआत होगी
        loadGallery();
    }

    // डाउनलोड बटन को 100% वर्किंग बनाने के लिए Modal ओपन फंक्शन
    function openModal(num) {
        const fileUrl = `${IMAGE_BASE_URL}${num}.webp`;
        modalImg.src = fileUrl;
        
        // 🚀 फिक्स: बिना नए टैब में भटकाए डायरेक्ट डाउनलोड के लिए कॉन्फ़िगरेशन
        downloadBtn.href = fileUrl;
        downloadBtn.setAttribute('download', `Wallpaper-${num}.webp`);
        
        modal.classList.add('active');
    }

    function closeModal() {
        modal.classList.remove('active');
    }

    // पहली बार वेबसाइट खुलने पर गैलरी लोड करना
    loadGallery();
</script>

</body>
</html>
