.card {

        transform 0.35s cubic-bezier(.2,.8,.2,1),
        border-color 0.35s,
        box-shadow 0.35s;
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(
        135deg,
        rgba(96,165,250,0.16),
        transparent 35%,
        transparent 70%,
        rgba(168,85,247,0.12)

    opacity: 0;
    transition: 0.35s;
    pointer-events: none;
    z-index: 2;
}

.card:hover {
    transform: translateY(-8px);
    border-color: rgba(147,197,253,0.35);
    box-shadow:
        0 25px 50px rgba(0,0,0,0.38),
        0 0 30px rgba(59,130,246,0.08);
}

.card:hover::before {
    opacity: 1;
}

.card img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 14px;
    background: #0d1117;
    transition: transform 0.5s ease;
}

.card:hover img {
    transform: scale(1.05);
}

.card-info {
    position: relative;
    z-index: 3;
    padding: 12px 8px 7px;
    margin: 0;

.card-info p,
.card-title {
    margin: 0;
    color: #d7e0ec;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
}

    let currentFilteredList = [...imagelist]; // सर्च फिल्टर के लिए बैकअप लिस्ट
    let currentPage = 1;
    const itemsPerPage = 12; // ⚡ एक बार में केवल 12 इमेजेस लोड होंगी (बिल्कुल स्मूथ चलेगा)

    const galleryGrid = document.getElementById('galleryGrid');
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const downloadBtn = document.getElementById('downloadBtn');

    // गैलरी लोड करने का मुख्य फंक्शन (Pagination के साथ)
    function loadGallery() {
        galleryGrid.innerHTML = "";
        
        if (currentFilteredList.length === 0) {
            galleryGrid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#8b949e;">No Wallpapers Found</p>`;
            updatePaginationControls(0);
            return;
        }

        // हिसाब लगाना कि किस पेज पर कौन सी इमेज दिखेगी
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, currentFilteredList.length);
        const itemsToDisplay = currentFilteredList.slice(startIndex, endIndex);

        itemsToDisplay.forEach(num => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(num);
            card.innerHTML = `
                <img src="${IMAGE_BASE_URL}${num}.webp" alt="Wallpaper ${num}" loading="lazy">
                <div class="card-info">
                    <p class="card-title">Wallpaper ${num}</p>
                </div>
            `;
            galleryGrid.appendChild(card);
        });

        updatePaginationControls(currentFilteredList.length);
    }

    // पेज बदलने और बटन्स को मैनेज करने का फंक्शन
    function updatePaginationControls(totalItems) {
    const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

    document.getElementById('pageInfo').innerText =
        `Page ${currentPage} of ${totalPages}`;

    document.getElementById('prevBtn').disabled =
        (currentPage === 1);

    document.getElementById('nextBtn').disabled =
        (currentPage === totalPages);
}


function goToPage() {
    const pageInput = document.getElementById('pageSearch');
    const requestedPage = parseInt(pageInput.value);

    const totalPages = Math.ceil(
        currentFilteredList.length / itemsPerPage
    );

    if (
        !requestedPage ||
        requestedPage < 1 ||
        requestedPage > totalPages
    ) {
        return;
    }

    currentPage = requestedPage;
    loadGallery();

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });

    pageInput.value = "";
}

    function changePage(direction) {
        currentPage += direction;
        loadGallery();
        window.scrollTo({ top: 0, behavior: 'smooth' }); // पेज बदलते ही ऊपर स्क्रॉल हो जाएगा
    }

    // लाइव सर्च फ़िल्टर
    let currentCategory = "all";

function selectCategory(category, button) {

    currentCategory = category;
    currentPage = 1;

    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.remove('active');
    });

    button.classList.add('active');

    filterImages();
}

function filterImages() {

    const query = document
        .getElementById('searchBar')
        .value
        .trim()
        .toLowerCase();

    let sourceList;

    if (currentCategory === "all") {
        sourceList = imagelist;
    } else {
        sourceList = categories[currentCategory];
    }

    currentFilteredList = sourceList.filter(num =>
        num.includes(query)
    );

    currentPage = 1;
    loadGallery();
}

    // डाउनलोड बटन को 100% वर्किंग बनाने के लिए Modal ओपन फंक्शन
    function openModal(num) {
    const fileUrl = `${IMAGE_BASE_URL}${num}.webp`;
    modalImg.src = fileUrl;
    
    // डाउनलोड बटन को डायरेक्ट फ़ोन में सेव करने के लिए मजबूर करने वाला कोड
    downloadBtn.onclick = (e) => {
        e.preventDefault(); 
        
        fetch(fileUrl)
            .then(response => response.blob())
            .then(blob => {
                const blobURL = URL.createObjectURL(blob);
                const tempAnchor = document.createElement('a');
                tempAnchor.href = blobURL;
                tempAnchor.setAttribute('download', `Wallpaper-${num}.webp`);
                document.body.appendChild(tempAnchor);
                tempAnchor.click();
                document.body.removeChild(tempAnchor);
                URL.revokeObjectURL(blobURL);
            })
            .catch(err => {
                window.open(fileUrl, '_blank');
            });
    };
    
    modal.classList.add('active');
    }

    function closeModal() {
        modal.classList.remove('active');
    }
    function convertImage(format) {
    const input = document.getElementById('imageUpload');

    if (!input.files || !input.files[0]) {
        alert('Please select a WEBP image first.');
        return;
    }

    const file = input.files[0];
    const reader = new FileReader();

    reader.onload = function(event) {
        const img = new Image();

        img.onload = function() {
            const canvas = document.createElement('canvas');

            canvas.width = img.width;
            canvas.height = img.height;

            const ctx = canvas.getContext('2d');

            if (format === 'image/jpeg') {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.drawImage(img, 0, 0);

            const extension =
                format === 'image/png' ? 'png' : 'jpg';

            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = url;
                link.download = `converted-image.${extension}`;

                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                URL.revokeObjectURL(url);
            }, format, 0.95);
        };

        img.src = event.target.result;
    };

    reader.readAsDataURL(file);
    }

    // पहली बार वेबसाइट खुलने पर गैलरी लोड करना
    loadGallery();
